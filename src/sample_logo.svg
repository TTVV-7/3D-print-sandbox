<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- The logo card's stand-in until one is uploaded: a made-up mark in
       printyours.ca's colours, drawn the way exported logos usually are:
       a class-styled fill, a group transform and a shape painted over
       another. So the default card exercises the same reader a real
       logo goes through. -->
  <style>.ink{fill:#0c1a2e}.flame{fill:#ff5b1f}</style>
  <g transform="translate(100 104)">
    <path class="ink" d="M0 -92 L78 -64 C78 10 50 58 0 88 C-50 58 -78 10 -78 -64 Z"/>
    <path class="flame" d="M0 -58 L13 -18 L55 -18 L21 7 L34 48 L0 23 L-34 48 L-21 7 L-55 -18 L-13 -18 Z"/>
    <path d="M-30 52 L0 62 L30 52 L30 60 L0 70 L-30 60 Z" style="fill:#f5f2ec"/>
  </g>
</svg>
